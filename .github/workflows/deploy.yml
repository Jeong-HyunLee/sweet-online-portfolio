name: Deploy to NAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/nas_deploy
          chmod 600 ~/.ssh/nas_deploy
          ssh-keyscan -H ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts
          printf "Host nas\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/nas_deploy\n  StrictHostKeyChecking no\n  IdentitiesOnly yes\n" \
            "${{ secrets.NAS_HOST }}" "${{ secrets.NAS_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          cat ~/.ssh/config

      - name: Test SSH connection
        run: ssh nas "echo SSH_OK; whoami"

      - name: Deploy dist/ to NAS via rsync
        run: rsync -avzr --delete dist/ nas:/volume1/web/lab-website/

name: Deploy to NAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/nas_deploy
          chmod 600 ~/.ssh/nas_deploy
          ssh-keyscan -H ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH connection
        run: |
          echo "=== SSH key fingerprint ==="
          ssh-keygen -lf ~/.ssh/nas_deploy
          echo "=== Testing SSH connection (verbose) ==="
          ssh -vvv -i ~/.ssh/nas_deploy -o StrictHostKeyChecking=no \
            ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }} "echo SSH_OK; whoami; uname -a" 2>&1 || true

      - name: Deploy dist/ to NAS via rsync
        run: |
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/nas_deploy -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}:/volume1/web/lab-website/

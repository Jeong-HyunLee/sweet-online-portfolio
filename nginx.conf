server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Paper PDFs served from NAS volume (mounted at runtime)
    # Public papers
    location /papers/public/ {
        alias /papers/public/;
        autoindex off;
        add_header Content-Disposition "inline";
    }

    # Private papers — restrict to CNU network
    location /papers/private/ {
        alias /papers/private/;
        autoindex off;
        allow 168.188.0.0/16;   # CNU campus network
        allow 192.168.0.0/16;   # NAS local network
        deny all;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html (ensures fresh deploys are picked up)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
